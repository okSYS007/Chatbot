telegram:
  # Put the real token in .env as TELEGRAM_BOT_TOKEN.
  chat_id: 0

admins:
  user_ids: []

welcome:
  enabled: true
  text: "Привет, {name}! Добро пожаловать в группу."

reputation:
  enabled: true
  # MVP mode: only admin/moderator reactions increase reputation.
  admin_only: true
  points_per_admin_reaction: 1
  # Reserved for future paid subscription logic.
  subscription_bonus_enabled: false
  subscription_multiplier: 2
  positive_reactions:
    - "👍"
    - "❤️"
    - "🔥"
  cooldown_days: 0
  active_min_messages: 20
  active_min_days: 14
  regular_weight: 1
  moderator_weight: 1
  moderators: []

storage:
  path: "data/state.json"

logging:
  path: "logs/bot.log"
