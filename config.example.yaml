telegram:
  # Put the real token in .env as TELEGRAM_BOT_TOKEN.
  chat_id: 0

admins:
  # These user_ids can use / admin commands and their reactions give reputation.
  # The bot also tries to add Telegram group admins here on startup.
  user_ids: []

welcome:
  enabled: true
  text: "Привет, {name}! Добро пожаловать в группу."
  # Необязательный список. Сохранённые через команды приветствия имеют приоритет.
  texts: []

daily_card:
  # Две папки сканируются рекурсивно; имена файлов могут быть произвольными.
  enabled: false
  images_folder: "cards/images"
  texts_folder: "cards/texts"
  # Для каждой фразы бот связывает случайную картинку со случайным текстом,
  # в имени которых встречается эта фраза.
  patterns:
    - "8 пентаклей"
    - "6 жезлов"
    - "10 кубков"
  chat_id: 0
  # ID темы форума. null — основной чат.
  message_thread_id: null
  time: "09:00"
  timezone: "Europe/Kyiv"

reputation:
  enabled: true
  # MVP mode: only reactions from admins.user_ids increase reputation.
  admin_only: true
  points_per_admin_reaction: 1
  # Reserved for future paid subscription logic.
  subscription_bonus_enabled: false
  subscription_multiplier: 2
  # Admin reactions from this list give +1 reputation.
  # Removing a counted reaction rolls this point back.
  positive_reactions:
    - "👍"
    - "❤️"
    - "🔥"
  cooldown_days: 0
  active_min_messages: 20
  active_min_days: 14
  regular_weight: 1
  moderator_weight: 1
  moderators: []

storage:
  path: "data/state.json"

logging:
  path: "logs/bot.log"
